<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arla decision-support agent: graph</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; max-width: 980px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  figure { margin: 1rem 0; }
  svg { max-width: 100%; height: auto; display: block; }
  figcaption { font-size: .9rem; opacity: .8; margin-top: .5rem; }
</style>
</head>
<body>
<h1>Arla decision-support agent</h1>
<p>How a question moves through the LangGraph agent.</p>
<figure>
<svg viewBox="0 0 1000 965" role="img" aria-label="Agent graph: the planner routes to a parallel RAG subgraph and news pipeline, gather merges them, decisions go through policy and risk, then synthesize and critic, with one retry back to RAG." font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="420" y="14" width="160" height="36" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<text x="500.0" y="36.0" text-anchor="middle" font-size="13" font-weight="600">question</text>
<path d="M500,50 V70" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="380" y="70" width="240" height="50" rx="7" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/>
<text x="500.0" y="92.0" text-anchor="middle" font-size="13" font-weight="600">Planner</text>
<text x="500.0" y="109.0" text-anchor="middle" font-size="11" opacity="0.75">intent + sub-questions (1 LLM call)</text>
<rect x="20" y="70" width="180" height="50" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<text x="110.0" y="92.0" text-anchor="middle" font-size="13" font-weight="600">Fixed reply</text>
<text x="110.0" y="109.0" text-anchor="middle" font-size="11" opacity="0.75">out_of_scope, ends here</text>
<path d="M380,95 H200" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<text x="290" y="88" text-anchor="middle" font-size="11" font-style="italic" opacity="0.85">out_of_scope</text>
<rect x="130" y="170" width="400" height="160" rx="10" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="146" y="192" font-size="13" font-weight="600">RAG subgraph, one per sub-question (parallel)</text>
<rect x="140" y="226" width="80" height="44" rx="7" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/>
<text x="180.0" y="252.0" text-anchor="middle" font-size="12" font-weight="600">rewrite</text>
<text x="180" y="262" text-anchor="middle" font-size="9" opacity="0.7">LLM</text>
<rect x="240" y="226" width="80" height="44" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<text x="280.0" y="252.0" text-anchor="middle" font-size="12" font-weight="600">retrieve</text>
<text x="280" y="262" text-anchor="middle" font-size="9" opacity="0.7">vector search</text>
<rect x="340" y="226" width="80" height="44" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<text x="380.0" y="252.0" text-anchor="middle" font-size="12" font-weight="600">grade</text>
<text x="380" y="262" text-anchor="middle" font-size="9" opacity="0.7">distance rules</text>
<rect x="440" y="226" width="80" height="44" rx="7" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/>
<text x="480.0" y="252.0" text-anchor="middle" font-size="12" font-weight="600">generate</text>
<text x="480" y="262" text-anchor="middle" font-size="9" opacity="0.7">LLM + quote</text>
<path d="M220,248 H240" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M320,248 H340" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M420,248 H440" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M380,270 V298 H180 V270" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="280" y="316" text-anchor="middle" font-size="11" font-style="italic" opacity="0.85">not relevant: retry once</text>
<path d="M450,120 V145 H330 V170" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<text x="390" y="139" text-anchor="middle" font-size="11" font-style="italic" opacity="0.85">lookup · market · decision</text>
<rect x="710" y="170" width="180" height="70" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<text x="800.0" y="202.0" text-anchor="middle" font-size="13" font-weight="600">News pipeline</text>
<text x="800.0" y="219.0" text-anchor="middle" font-size="11" opacity="0.75">FinBERT + event flags, no LLM</text>
<path d="M550,120 V145 H800 V170" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<text x="675" y="139" text-anchor="middle" font-size="11" font-style="italic" opacity="0.85">market · decision</text>
<rect x="380" y="360" width="240" height="50" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<text x="500.0" y="382.0" text-anchor="middle" font-size="13" font-weight="600">Gather</text>
<text x="500.0" y="399.0" text-anchor="middle" font-size="11" opacity="0.75">merge, renumber [n], warnings</text>
<path d="M330,330 V385 H380" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M800,240 V385 H620" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M600,360 V300 H740 V240" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="670" y="292" text-anchor="middle" font-size="11" font-style="italic" opacity="0.85">open issue → news</text>
<rect x="140" y="470" width="240" height="60" rx="7" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/>
<text x="260.0" y="497.0" text-anchor="middle" font-size="13" font-weight="600">Policy comparator</text>
<text x="260.0" y="514.0" text-anchor="middle" font-size="11" opacity="0.75">retrieve policy docs + 1 LLM verdict</text>
<rect x="140" y="560" width="240" height="60" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<text x="260.0" y="587.0" text-anchor="middle" font-size="13" font-weight="600">Risk scorer</text>
<text x="260.0" y="604.0" text-anchor="middle" font-size="11" opacity="0.75">rules; reads news + RAG evidence</text>
<path d="M470,410 V440 H260 V470" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<text x="365" y="434" text-anchor="middle" font-size="11" font-style="italic" opacity="0.85">decision</text>
<path d="M260,530 V560" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M260,620 V710 H380" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M560,410 V680" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<text x="568" y="540" text-anchor="start" font-size="11" font-style="italic" opacity="0.85">lookup · market</text>
<rect x="380" y="680" width="240" height="60" rx="7" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1.4"/>
<text x="500.0" y="707.0" text-anchor="middle" font-size="13" font-weight="600">Synthesize</text>
<text x="500.0" y="724.0" text-anchor="middle" font-size="11" opacity="0.75">code builds sections, 1 LLM summary</text>
<path d="M500,740 V780" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="380" y="780" width="240" height="50" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<text x="500.0" y="802.0" text-anchor="middle" font-size="13" font-weight="600">Critic</text>
<text x="500.0" y="819.0" text-anchor="middle" font-size="11" opacity="0.75">rules: citations, figures, quote</text>
<path d="M500,830 V880" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<text x="510" y="860" text-anchor="start" font-size="11" font-style="italic" opacity="0.85">passed, or retry already used</text>
<rect x="450" y="880" width="100" height="34" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<text x="500.0" y="901.0" text-anchor="middle" font-size="13" font-weight="600">END</text>
<rect x="100" y="780" width="160" height="50" rx="7" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.4"/>
<text x="180.0" y="802.0" text-anchor="middle" font-size="13" font-weight="600">Retry</text>
<text x="180.0" y="819.0" text-anchor="middle" font-size="11" opacity="0.75">k 5 → 8, wider policy search</text>
<path d="M380,805 H260" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<text x="320" y="797" text-anchor="middle" font-size="11" font-style="italic" opacity="0.85">failed, retry left</text>
<path d="M100,805 H60 V250 H130" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="44" y="530" text-anchor="middle" font-size="11" font-style="italic" opacity="0.85" transform="rotate(-90 44 530)">re-run RAG with 8 chunks</text>
<rect x="140" y="935" width="18" height="12" rx="3" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6"/>
<text x="166" y="945" font-size="11">uses the LLM</text>
<rect x="270" y="935" width="18" height="12" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor"/>
<text x="296" y="945" font-size="11">rules / code only</text>
<path d="M420,941 H450" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="458" y="945" font-size="11">loop back</text>
</svg>
<figcaption>Every question starts at the planner. Lookups skip news, policy and risk. Decisions run all of them. The critic can send the question back to RAG once; if it still fails, the answer is returned with a warning.</figcaption>
</figure>
</body>
</html>
